<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Meteo & Pager BLE</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --alert: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: #334155;
      color: var(--text-dim);
    }
    .status-badge.connected { background: rgba(34, 197, 94, 0.2); color: var(--success); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-full { grid-column: span 2; }
    .card-title { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .card-val { font-size: 1.8rem; font-weight: 700; }
    .card-sub { font-size: 0.8rem; color: var(--text-dim); }

    .pager-box {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    
    #log {
      font-family: monospace;
      font-size: 0.75rem;
      background: #000;
      color: #38bdf8;
      padding: 10px;
      border-radius: 8px;
      height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Estação Meteo Erechim</h1>
        <span id="status" class="status-badge">Desconectado</span>
      </div>
      <button id="btnConnect" onclick="toggleConnect()">Conectar BLE</button>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-title">Temperatura</div>
        <div class="card-val" id="valTemp">--.- <span style="font-size:1rem">°C</span></div>
      </div>
      <div class="card">
        <div class="card-title">Umidade</div>
        <div class="card-val" id="valUmi">-- <span style="font-size:1rem">%</span></div>
      </div>
      <div class="card card-full">
        <div class="card-title">Pressão Atmosférica & Tendência</div>
        <div class="card-val" id="valPres">----.- <span style="font-size:1rem">hPa</span></div>
        <div class="card-sub" id="valTend">Aguardando dados...</div>
      </div>
      <div class="card">
        <div class="card-title">Altitude Estimada</div>
        <div class="card-val" id="valAlt">---.- <span style="font-size:1rem">m</span></div>
      </div>
      <div class="card">
        <div class="card-title">Chuva Local</div>
        <div class="card-val" id="valChuva">---</div>
        <div class="card-sub" id="valChuvaRaw">Raw: ---</div>
      </div>
    </div>

    <!-- Módulo Pager (Envio de Mensagem para o OLED) -->
    <div class="pager-box">
      <div class="card-title">Enviar Recado para o Display OLED</div>
      <div class="input-group">
        <input type="text" id="msgInput" placeholder="Digite uma mensagem..." maxlength="60" disabled />
        <button id="btnSend" onclick="enviarMensagem()" disabled>Enviar</button>
      </div>
    </div>

    <div id="log">Console Serial BLE pronto...</div>
  </div>

  <script>
    // UUIDs universais de módulo BLE UART (HM-10, AT-09, CC2541, MLT-BT05)
    const UART_SERVICE = 0xFFE0;
    const UART_CHAR    = 0xFFE1;

    let device = null;
    let characteristic = null;
    let rxBuffer = "";

    function log(txt) {
      const el = document.getElementById('log');
      el.textContent += "\n" + txt;
      el.scrollTop = el.scrollHeight;
    }

    async function toggleConnect() {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
        return;
      }

      try {
        log("Solicitando permissão Bluetooth...");
        device = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "HC-" },
            { namePrefix: "BT" },
            { namePrefix: "HM" },
            { namePrefix: "AT" }
          ],
          optionalServices: [UART_SERVICE]
        });

        device.addEventListener('gattserverdisconnected', onDisconnected);
        log("Conectando ao GATT Server...");
        const server = await device.gatt.connect();

        log("Obtendo Serviço Serial UART...");
        const service = await server.getPrimaryService(UART_SERVICE);

        log("Obtendo Característica TX/RX...");
        characteristic = await service.getCharacteristic(UART_CHAR);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('status').textContent = "Conectado: " + device.name;
        document.getElementById('status').classList.add('connected');
        document.getElementById('btnConnect').textContent = "Desconectar";
        document.getElementById('msgInput').disabled = false;
        document.getElementById('btnSend').disabled = false;
        log("Conexão estabelecida com sucesso!");

      } catch (err) {
        log("Erro: " + err.message);
        onDisconnected();
      }
    }

    function onDisconnected() {
      document.getElementById('status').textContent = "Desconectado";
      document.getElementById('status').classList.remove('connected');
      document.getElementById('btnConnect').textContent = "Conectar BLE";
      document.getElementById('msgInput').disabled = true;
      document.getElementById('btnSend').disabled = true;
      device = null;
      characteristic = null;
      log("Dispositivo desconectado.");
    }

    // Fragmentos de pacotes BLE chegam em blocos de até 20 bytes
    function handleNotifications(event) {
      const value = event.target.value;
      const decoder = new TextDecoder('utf-8');
      rxBuffer += decoder.decode(value);

      const lines = rxBuffer.split('\n');
      rxBuffer = lines.pop(); // Guarda fragmento incompleto

      for (const line of lines) {
        processarLinha(line.trim());
      }
    }

    function processarLinha(l) {
      if (!l || l.startsWith("==")) return;

      if (l.startsWith("Temp:")) {
        const val = l.replace("Temp:", "").replace("C", "").trim();
        document.getElementById('valTemp').innerHTML = `${val} <span style="font-size:1rem">°C</span>`;
      } 
      else if (l.startsWith("Umidade:")) {
        const val = l.replace("Umidade:", "").replace("%", "").trim();
        document.getElementById('valUmi').innerHTML = `${val} <span style="font-size:1rem">%</span>`;
      } 
      else if (l.startsWith("Pressao:")) {
        const val = l.replace("Pressao:", "").replace("hPa", "").trim();
        document.getElementById('valPres').innerHTML = `${val} <span style="font-size:1rem">hPa</span>`;
      } 
      else if (l.startsWith("Alt:")) {
        const val = l.replace("Alt:", "").replace("m", "").trim();
        document.getElementById('valAlt').innerHTML = `${val} <span style="font-size:1rem">m</span>`;
      } 
      else if (l.startsWith("Tendencia:")) {
        const val = l.replace("Tendencia:", "").trim();
        document.getElementById('valTend').textContent = val;
      } 
      else if (l.startsWith("Chuva:")) {
        const match = l.match(/Chuva:\s+([A-Z!]+)\s+\(raw:\s*(\d+)\)/);
        if (match) {
          const chovendo = match[1];
          const raw = match[2];
          const elChuva = document.getElementById('valChuva');
          elChuva.textContent = chovendo;
          elChuva.style.color = chovendo === "SIM!" ? "var(--alert)" : "var(--success)";
          document.getElementById('valChuvaRaw').textContent = `Raw: ${raw}`;
        }
      }
    }

    // Envio para o Pager do Arduino via BLE
    async function enviarMensagem() {
      const input = document.getElementById('msgInput');
      const texto = input.value.trim();
      if (!texto || !characteristic) return;

      try {
        const encoder = new TextEncoder();
        // O Arduino aguarda um '\n' no bluetooth.readStringUntil('\n')
        const data = encoder.encode(texto + "\n");
        await characteristic.writeValue(data);
        log(`Enviado ao OLED: "${texto}"`);
        input.value = "";
      } catch (err) {
        log("Falha ao enviar: " + err.message);
      }
    }

    document.getElementById('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviarMensagem();
    });
  </script>
</body>
</html>
